<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geodude Pokemon Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Pokemon Card -->
    <div class="pokemon-card">

        <!-- Card Header -->
        <div class="card-header">
            <span class="basic">BASIC</span>

            <span class="pokemon-name">
                Geodude
            </span>

            <span class="hp">
                60 HP ●
            </span>
        </div>


        <!-- Pokemon Picture -->
        <div class="picture-area">

            <!-- Background Mountains -->
            <div class="mountain mountain-one"></div>
            <div class="mountain mountain-two"></div>

            <!-- Ground -->
            <div class="ground"></div>

            <!-- Geodude -->
            <div class="geodude">

                <!-- Left Arm -->
                <div class="left-arm">
                    <div class="left-fist"></div>
                </div>

                <!-- Right Arm -->
                <div class="right-arm">
                    <div class="right-fist"></div>
                </div>

                <!-- Geodude Body -->
                <div class="geodude-body">

                    <!-- Eyebrows -->
                    <div class="left-eyebrow"></div>
                    <div class="right-eyebrow"></div>

                    <!-- Eyes -->
                    <div class="left-eye">
                        <div class="pupil"></div>
                    </div>

                    <div class="right-eye">
                        <div class="pupil"></div>
                    </div>

                    <!-- Mouth -->
                    <div class="mouth"></div>

                </div>

            </div>

        </div>


        <!-- Pokemon Information -->
        <div class="pokemon-info">
            NO. 074 &nbsp;&nbsp; Rock Pokémon
        </div>


        <!-- Rollout Attack -->
        <div class="attack">

            <div class="energy">
                ●
            </div>

            <div class="attack-name">
                Rollout
            </div>

            <div class="damage">
                10
            </div>

        </div>


        <div class="divider"></div>


        <!-- Flail Attack -->
        <div class="attack">

            <div class="energy">
                ● ●
            </div>

            <div class="attack-name">
                Flail
            </div>

            <div class="damage">
                10×
            </div>

        </div>


        <!-- Attack Description -->
        <div class="attack-description">
            Does 10 damage times the number of damage counters
            on this Pokémon.
        </div>


        <!-- Bottom Information -->
        <div class="bottom-info">

            <div class="bottom-section">
                <strong>Weakness</strong>
                <br>
                Grass ×2
            </div>

            <div class="bottom-section">
                <strong>Resistance</strong>
                <br>
                —
            </div>

            <div class="bottom-section">
                <strong>Retreat</strong>
                <br>
                ● ●
            </div>

        </div>


        <!-- Flavor Text -->
        <div class="flavor-text">
            Found in fields and mountains. Mistaking them for
            boulders, people often step or trip on them.
        </div>


        <!-- Card Number -->
        <div class="card-number">
            45 / 106
        </div>

    </div>

</body>

</html>
